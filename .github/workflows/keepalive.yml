# Visits Supabase and HubSpot every 3 days so the free accounts stay active.
name: Keepalive

on:
  schedule:
    - cron: "0 4 */3 * *"   # 04:00 UTC, every 3rd day of the month
  workflow_dispatch:         # allows a manual run

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Supabase ping
        run: uv run scripts/ping_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: HubSpot ping
        if: success() || failure()   # still visit HubSpot if Supabase failed
        run: uv run scripts/ping_hubspot.py
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
