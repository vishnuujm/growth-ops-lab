[project]
name = "growth-ops-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.63.0",
    "google-auth>=2.63.1",
    "google-cloud-bigquery>=3.47.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
